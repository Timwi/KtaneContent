<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1">
    <title>新・絵文字算 — Keep Talking and Nobody Explodes Module</title>
    <link rel="stylesheet" type="text/css" href="css/font.css">
    <link rel="stylesheet" type="text/css" href="css/font-japanese.css">
    <link rel="stylesheet" type="text/css" href="css/normalize.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="js/ktane-utils.js"></script>
    <style>
        .emoji-math {
            margin-top: 1em;
        }
        .emoji-math td, .emoji-math th {
            text-align: center;
            padding: .5em .6em .4em;
        }
        img.emoji {
            width: 1.1em;
        }
        .flavour-text img {
            width: 0.8em;
        }
        .dark img.emoji, .dark .flavour-text img {
            filter:invert(87%);
        }
    </style>
</head>
<body>
    <div class="section">
        <div class="page page-bg-04">
            <div class="page-header">
                <span class="page-header-doc-title">Keep Talking and Nobody Explodes Mod</span>
                <span class="page-header-section-title">新・絵文字算</span>
            </div>
            <div class="page-content">
                <img src="img/Component/Emoji Math (.svg" class="diagram">
                <h2>モジュール詳細：新・絵文字算</h2>
                <p class="flavour-text">
                    <img class="emoji-flavor" src="img/Emoticon Math/Dollar Sign.svg">
                    <img class="emoji-flavor" src="img/Emoticon Math/Asterisk.svg">
                    <img class="emoji-flavor" src="img/Emoticon Math/Comma.svg">
                    <img class="emoji-flavor" src="img/Emoticon Math/Digit Seven.svg">
                    <!-- Should be $*,7 -->
                </p>

                <p>ディスプレーの絵文字を数字／演算子に変換し、計算結果を入力する。送信するには「＝」を使用する。結果が負の数の場合は「-」を使用する。回答は削除できないため、慎重に押す必要がある。</p>

                <p>
                    例:
                    <img class="emoji" src="img/Emoticon Math/Percent Sign.svg">
                    <img class="emoji" src="img/Emoticon Math/Question Mark.svg">
                    <img class="emoji" src="img/Emoticon Math/Dollar Sign.svg">
                    は1+1に変換される。
                </p>

                <table class='emoji-math'>
                    <tr><th>絵文字</th><th>数字</th></tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Exclamation Mark.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Quotation Mark.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Number Sign.svg">
                        </td>
                        <td>0</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Dollar Sign.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Percent Sign.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Ampersand.svg">
                        </td>
                        <td>1</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Apostrophe.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Left Parenthesis.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Right Parenthesis.svg">
                        </td>
                        <td>2</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Asterisk.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Plus Sign.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Comma.svg">
                        </td>
                        <td>3</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Hyphen-Minus.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Full Stop.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Solidus.svg">
                        </td>
                        <td>4</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Digit Zero.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Digit One.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Digit Two.svg">
                        </td>
                        <td>5</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Digit Three.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Digit Four.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Digit Five.svg">
                        </td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Digit Six.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Digit Seven.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Digit Eight.svg">
                        </td>
                        <td>7</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Digit Nine.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Colon.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Semicolon.svg">
                        </td>
                        <td>8</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Less-Than Sign.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Equals Sign.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Greater-Than Sign.svg">
                        </td>
                        <td>9</td>
                    </tr>
                </table>
                <table class='emoji-math'>
                    <tr><th>絵文字</th><th>演算子</th></tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Question Mark.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Commercial At.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Latin Capital Letter A.svg">
                        </td>
                        <td>+</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Latin Capital Letter B.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Latin Capital Letter C.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Latin Capital Letter D.svg">
                        </td>
                        <td>-</td>
                    </tr>
                    <tr>
                        <td>
                            <img class="emoji" src="img/Emoticon Math/Latin Capital Letter E.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Latin Capital Letter F.svg"> 、
                            <img class="emoji" src="img/Emoticon Math/Latin Capital Letter G.svg">
                        </td>
                        <td>×</td>
                    </tr>
                </table>
            </div>
            <div class="page-footer relative-footer">ページ 1/1</div>
        </div>
    </div>
</body>
</html>
