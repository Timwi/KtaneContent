<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1">
    <title>Confirmation Codes — Keep Talking and Nobody Explodes Module</title>
    <link rel="stylesheet" type="text/css" href="css/font.css">
    <link rel="stylesheet" type="text/css" href="css/normalize.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="js/ktane-utils.js"></script>
    <style>
        .dark svg.vector {
            path { stroke: #E5E5E5; }
            text { fill: #E5E5E5; }
        }

        .page {
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            user-select: none;
            -ms-user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            width: 100%;
        }

        .dark .overlay1  {
            content: url("img/Confirmation Codes/page1d.png");
        }

        .dark .overlay2  {
            content: url("img/Confirmation Codes/page2d.png");
        }
    </style>
</head>
<body>
    <div class="section">
        <div class="page page-bg-03">
            <img class="overlay overlay1" src="img/Confirmation Codes/page1.png">

            <div class="page-content">
                <p class="flavour-text hidden">You have (1) new message.</p>

            </div>
            <div class="page-footer relative-footer"></div>
        </div>

        <div class="page page-bg-01">
            <img class="overlay overlay2" src="img/Confirmation Codes/page2.png">
            <div class="page-header">
            </div>
            <div class="page-content">
            </div>
            <div class="page-footer relative-footer"></div>
        </div>
    </div>
</body>
</html>
