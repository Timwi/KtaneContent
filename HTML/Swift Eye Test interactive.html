<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1">
    <title>Swift Eye Test — Keep Talking and Nobody Explodes Module</title>
    <link rel="stylesheet" type="text/css" href="css/font.css">
    <link rel="stylesheet" type="text/css" href="css/normalize.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <script src="js/ktane-utils.js"></script>
	<script defer>
		const state = {
			solved: false,
			interactable: true,
			sequenceRunning: false,
			switchFlipped: false,
			
			sequence: [],
			targetPositions: [],
			submittedIndexes: [],
			currentIndex: -1
		};
		
		let screens;
		let switchButton;
		let moduleElement;
		document.addEventListener("DOMContentLoaded", () => {
			screens = [...document.querySelectorAll(".screen .shape")];
			switchButton = document.getElementById("switch-hitbox");
			startAudio = document.getElementById("start-audio");
			moduleElement = document.getElementById("module");
			
			setupImages();
			switchButton.disabled = true;
			
			preloadAssets()
				.then(results => {
					const failures = results.filter(
						result => result.status === "rejected"
					);
		
					if (failures.length > 0) {
						console.error(`${failures.length} image(s) failed to preload:`, failures.map(result => result.reason));
					} else {
						console.log("All images preloaded successfully.");
					}
				})
				.catch(error => {
					console.error("Unexpected preload error:", error);
				})
				.finally(() => {
					switchButton.disabled = false;
					switchButton.addEventListener("click", handleSwitchPress);
				});
			
		});
		
		function handleSwitchPress() {
			if (state.solved || !state.interactable)
				return;
			
			state.switchFlipped = !state.switchFlipped;

			const sound = state.switchFlipped ? switchSound1 : switchSound2;
			sound.currentTime = 0;
			sound.play();
			
			if (!state.sequenceRunning) {
				startAudio.currentTime = 0;

				startAudio.play().catch(error => {
					console.error("Could not play audio:", error);
				});
			
				runSequence();
				return;
			}
		
			state.submittedIndexes.push(state.currentIndex);
			state.interactable = false;
		
			console.log("Selected position:", state.currentIndex + 1);
		}
		
		function finishSequence() {
			const submitted = [...state.submittedIndexes].sort((a, b) => a - b);
			const targets = [...state.targetPositions].sort((a, b) => a - b);
		
			const correct = submitted.length === targets.length && submitted.every((value, index) => value === targets[index]);
		
			if (correct) {
				state.solved = true;
				moduleElement.style.backgroundImage = 'url("img/Swift Eye Test/ModuleBackgroundSolved.png")';
				console.log("Correct submission. Module solved.");
			} else {
				moduleElement.style.backgroundImage = 'url("img/Swift Eye Test/ModuleBackgroundStrike.png")';
				console.log("Incorrect submission. Strike.");
				setTimeout(() => { moduleElement.style.backgroundImage = 'url("img/Swift Eye Test/ModuleBackground.png")'; }, 1000);
			}
		
			clearScreens();
		
			state.submittedIndexes = [];
			state.currentIndex = -1;
			state.sequenceRunning = false;
			state.interactable = true;
		}
		
		const counts = ["1", "2", "3"];
		const fillings = ["empty", "filled", "striped"];
		const colors = ["red", "yellow", "blue"];
		
		const singularShapes = ["diamond", "squiggle", "capsule"];
		const pluralShapes = ["diamonds", "squiggles", "capsules"];
		
		function getShapeFilename(countIndex, fillingIndex, colorIndex, shapeIndex) {
			const count = counts[countIndex];
			const filling = fillings[fillingIndex];
			const color = colors[colorIndex];
		
			const shape = count === "1" ? singularShapes[shapeIndex] : pluralShapes[shapeIndex];
		
			return `${count} ${filling} ${color} ${shape}.png`;
		}
		
		function getShapeUrlFromAttributes(countIndex, fillingIndex, colorIndex, shapeIndex) {
			const filename = getShapeFilename( countIndex, fillingIndex, colorIndex, shapeIndex);
		
			return `img/Swift Eye Test/Shapes/${filename}`;
		}
		
		function preloadImage(url) {
			return new Promise((resolve, reject) => {
				const image = new Image();
				image.onload = () => resolve(url);
				image.onerror = () => { reject(new Error(`Could not preload image: ${url}`)); };
				image.src = url;
			});
		}
		
		async function preloadAssets() {
			const imageUrls = [
				"img/Swift Eye Test/ModuleBackground.png",
				"img/Swift Eye Test/ModuleBackgroundSolved.png",
				"img/Swift Eye Test/ModuleBackgroundStrike.png"
			];
		
			for (let shapeId = 0; shapeId < 81; shapeId++) {
				imageUrls.push(getShapeUrl(shapeId));
			}
		
			switchSound1.load();
			switchSound2.load();
			startAudio.load();
			
			return Promise.allSettled(imageUrls.map(preloadImage));
		}
		
		function randomInt(min, max) {
			return Math.floor(Math.random() * (max - min)) + min;
		}
		
		function shuffle(array) {
			const result = [...array];
			for (let i = result.length - 1; i > 0; i--) {
				const j = randomInt(0, i + 1);
				[result[i], result[j]] = [result[j], result[i]];
			}
			return result;
		}
		
		function getTargetPositions() {
			const numberOfSets = randomInt(3, 9);
			return shuffle(Array.from({ length: 24 }, (_, index) => index)).slice(0, numberOfSets).sort((a, b) => a - b);
		}
		
		function getShapeAttributes(shapeId) {
			return [
				Math.floor(shapeId / 1) % 3,
				Math.floor(shapeId / 3) % 3,
				Math.floor(shapeId / 9) % 3,
				Math.floor(shapeId / 27) % 3
			];
		}

		function getShapeUrl(shapeId) {
			const [countIndex, fillingIndex, colorIndex, shapeIndex] = getShapeAttributes(shapeId);
			return getShapeUrlFromAttributes(countIndex, fillingIndex, colorIndex, shapeIndex);
		}

		function isSet(shapeIds) {
			const attributes = shapeIds.map(getShapeAttributes);
		
			for (let attributeIndex = 0; attributeIndex < 4; attributeIndex++) {
				const values = attributes.map(shapeAttributes => shapeAttributes[attributeIndex]);
				const distinctCount = new Set(values).size;
		
				if (distinctCount === 2)
					return false;
			}
			return true;
		}
		
		function generateSetSequence(targetPositions) {
			const targetSet = new Set(targetPositions);
			const sequence = [];
		
			for (let position = 0; position < 24; position++) {
				let shapes;
		
				do {
					shapes = [randomInt(0, 81), randomInt(0, 81), randomInt(0, 81)];
				} while (
					new Set(shapes).size !== 3 || isSet(shapes) !== targetSet.has(position)
				);
		
				sequence.push(shapes);
			}
		
			return sequence;
		}
		
		function displaySequencePosition(position) {
			const shapeIds = state.sequence[position];
		
			screens.forEach((screen, screenIndex) => { const expectedUrl = getShapeUrl(shapeIds[screenIndex]);
		
				screen.classList.remove("visible");
		
				screen.onload = () => { screen.classList.add("visible"); };
		
				screen.onerror = () => {
					screen.classList.remove("visible");
					console.error("Could not load image:", expectedUrl);
				};
		
				screen.src = expectedUrl;
			});
		
			pulseScreens();
		}
		
		function setupImages() {
			screens.forEach(screen => {
				screen.addEventListener("load", () => {
					screen.classList.add("visible");
				});
		
				screen.addEventListener("error", () => {
					screen.classList.remove("visible");
					console.error("Could not load image:", screen.src);
				});
			});
		}
		
		function clearScreens() {
			screens.forEach(screen => {
				screen.classList.remove("visible", "pulse");
				screen.removeAttribute("src");
			});
		}
		
		function pulseScreens() {
			screens.forEach(screen => {
				screen.classList.remove("pulse");
		
				void screen.offsetWidth;
		
				screen.classList.add("pulse");
			});
		}
		
		function wait(milliseconds) {
			return new Promise(resolve => {
				setTimeout(resolve, milliseconds);
			});
		}
		
		async function runSequence() {
			state.interactable = false;
			state.sequenceRunning = true;
			state.submittedIndexes = [];
		
			state.targetPositions = getTargetPositions();
			state.sequence = generateSetSequence(state.targetPositions);
		
			console.log("Target positions:", state.targetPositions.map(index => index + 1));
		
			await wait(10);
		
			state.interactable = true;
		
			for (let index = 0; index < 24; index++) {
				state.currentIndex = index;
				state.interactable = true;
		
				displaySequencePosition(index);
		
				await wait(1461);
			}
		
			finishSequence();
		}
		
		const switchSound1 = new Audio("audio/Swift Eye Test/Switch1.mp3");
		const switchSound2 = new Audio("audio/Swift Eye Test/Switch2.mp3");
		
		switchSound1.preload = "auto";
		switchSound2.preload = "auto";
	</script>
	<style>
		#module {
            width: 641px;
            height: 641px;
            background-image: url("img/Swift Eye Test/ModuleBackground.png");
            background-size: contain;
            position: relative;
            user-select: none;
        }
		.screen {
			position: absolute;
			top: 34%;
			width: 21.5%;
			height: 30%;
			overflow: hidden;
			pointer-events: none;
		}
		.screen-left { left: 11%; }
		.screen-middle { left: 38.5%; }
		.screen-right { left: 66%; }
		
		.screen img.shape {
			display: none;
			width: 100%;
			height: 100%;
			object-fit: contain;
			transform: rotate(90deg);
		}
		.screen img.shape.visible {
			display: block;
		}
		
		#switch-hitbox {
			position: absolute;
		
			left: 31%;
			top: 72%;
			width: 37%;
			height: 15%;
		
			padding: 0;
			border: 0;
			margin: 0;
		
			background: transparent;
			appearance: none;
			cursor: pointer;
		
			z-index: 10;
		}
		
		#switch-hitbox:focus-visible {
			outline: 3px solid white;
			outline-offset: 2px;
		}
		
		.shape.pulse {
			animation: shape-pulse 300ms ease-out;
		}
		
		@keyframes shape-pulse {
			from {
				transform: rotate(90deg) scale(1.125);
			}
		
			to {
				transform: rotate(90deg) scale(1);
			}
		}
	</style>
</head>
<body>
    <div class="section">
        <div class="page page-bg-01">
            <div class="page-header">
                <span class="page-header-doc-title">Keep Talking and Nobody Explodes Mod</span>
                <span class="page-header-section-title">Swift Eye Test</span>
            </div>
            <div class="page-content">
                <h2>On the Subject of Swift Eye Test</h2>
                <p class="flavour-text">On your marks, get S.E.T., go!</p>
				<p>Refer to the <a href="Swift Eye Test.html">original manual</a> for instructions.</p>
				<p>The console provides logging.</p>
				<div id="module">
					<div class="screen screen-left">
						<img class="shape" alt="">
					</div>
					<div class="screen screen-middle">
						<img class="shape" alt="">
					</div>
					<div class="screen screen-right">
						<img class="shape" alt="">
					</div>
					
					<button
						id="switch-hitbox"
						type="button"
						aria-label="Flip switch">
					</button>
                </div>
				<audio
					id="start-audio"
					src="audio/Swift Eye Test/wrongreprisenoteblocks.mp3"
					preload="auto">
				</audio>
            </div>
            <div class="page-footer relative-footer">Page 1 of 1</div>
        </div>
    </div>
</body>
</html>
